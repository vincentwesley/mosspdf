name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identity check (only vincentwesley commits)
        run: |
          bad=$(git log --format='%an|%ae|%cn|%ce' | tr '|' '\n' | sort -u | grep -vE '^(vincentwesley|Vincent Wesley|GitHub|github-actions\[bot\]|dependabot\[bot\]|221810966\+vincentwesley@users\.noreply\.github\.com|noreply@github\.com|[0-9]+\+(github-actions|dependabot)\[bot\]@users\.noreply\.github\.com)$' || true)
          if [ -n "$bad" ]; then echo "Unexpected commit identities:"; echo "$bad"; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install qpdf
        run: sudo apt-get update -q && sudo apt-get install -y qpdf
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:budgets
      - run: npm run licences

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-chrome, browser: chromium }
          - { project: mobile-safari, browser: webkit }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install qpdf
        run: sudo apt-get update -q && sudo apt-get install -y qpdf
      - name: Playwright version
        id: pw
        run: echo "v=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/playwright-core/.local-browsers
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}-${{ matrix.browser }}
      - name: Make apt retry and wait for its lock
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-mosspdf-ci
          echo 'DPkg::Lock::Timeout "300";' | sudo tee -a /etc/apt/apt.conf.d/80-mosspdf-ci
      - name: Install Playwright browser
        timeout-minutes: 25
        # An Ubuntu mirror sometimes stalls the apt part for 25+ minutes; retry instead of waiting it out.
        run: |
          for i in 1 2 3; do
            timeout 600 npm run pw -- install --with-deps ${{ matrix.browser }} && exit 0
            echo "browser install attempt $i failed or stalled, retrying"
            # timeout kills npm but not the apt-get it started; that orphan keeps the dpkg lock and every retry exits 100. Wait for it.
            for _ in $(seq 1 60); do pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null || break; sleep 5; done
            sudo dpkg --configure -a || true
            sudo apt-get update -q || true # exit code 100 is usually a stale or half-synced mirror index
            sleep 20
          done
          exit 1
      - run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
